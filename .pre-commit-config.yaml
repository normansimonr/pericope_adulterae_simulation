# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types: [python]
        files: \.py$
      - id: ruff-format
        types: [python]
        files: \.py$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--no-strict-optional, --ignore-missing-imports, --disable-error-code=import-untyped]
        types: [python]
        files: \.py$
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: poetry run pytest --show-text-diffs
        language: system
        pass_filenames: false
        always_run: true
        types: [python]
