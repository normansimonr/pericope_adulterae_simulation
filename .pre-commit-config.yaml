# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, "--select=E,F,C901", --config, "lint.mccabe.max-complexity=7"]
        types: [python]
        files: \.py$
      - id: ruff-format
        types: [python]
        files: \.py$
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        args: [--no-strict-optional, --ignore-missing-imports, --disable-error-code=import-untyped]
        types: [python]
        files: \.py$
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: poetry run pytest --show-text-diffs
        language: system
        pass_filenames: false
        always_run: true
        types: [python]
