# --- Advanced Textual & Demographic Configuration ---
# Optional parameters for fine-tuning the simulation's behavior.
# Defaults match established historical models.

# reputation_mutation_mapping (Dict[int, float], optional): Maps reputation (1-5)
# to the expected proportion of segments that will mutate during a copy.
reputation_mutation_mapping:
  1: 0.03
  2: 0.025
  3: 0.02
  4: 0.015
  5: 0.01

# survivor_sampling_targets (Dict[str, Any], optional): Targets and rules for the
# survivorship-biased sampling process.
survivor_sampling_targets:
  target_total: 3000
  target_born_650_or_later: 2400
  target_born_earlier: 600
  proportion_asia_minor: 0.98
  sampling_seed_offset: 999999
  eligibility_min_tick: 300 # Only nodes born after this tick are eligible for sampling
  strata_boundary_tick: 650 # Ticks >= this are "later", < are "earlier"
  strata_focus_region: "Asia Minor" # The region with high survival probability

# lifespan_parameters (Dict[str, Dict[str, Dict[str, float]]], optional):
# Lognormal distribution parameters (mu, sigma) for manuscript lifespans,
# categorized by material and region.
lifespan_parameters:
  papyrus:
    Asia Minor: {mu: 4.72, sigma: 0.30}
    Levant: {mu: 4.72, sigma: 0.30}
    Egypt: {mu: 5.12, sigma: 0.60}
  parchment:
    Asia Minor: {mu: 5.5, sigma: 0.5}
    Levant: {mu: 5.5, sigma: 0.5}
    Egypt: {mu: 6.0, sigma: 0.5}
  paper:
    Asia Minor: {mu: 5.0, sigma: 0.5}
    Levant: {mu: 5.0, sigma: 0.5}
    Egypt: {mu: 5.5, sigma: 0.5}

# region_bounds (Dict[str, List[List[float]]], optional):
# Bounding box coordinates [[xmin, xmax], [ymin, ymax]] for each geographical region.
region_bounds:
  Asia Minor: [[0.0, 100.0], [0.0, 100.0]]
  Egypt: [[200.0, 300.0], [200.0, 300.0]]
  Levant: [[400.0, 500.0], [400.0, 500.0]]

# regional_demand_distributions (Dict[str, Dict[str, float]], optional):
# Defines how aggregate demand is distributed across regions for different centuries.
regional_demand_distributions:
  "0-2": {"Asia Minor": 0.70, "Levant": 0.25, "Egypt": 0.05}
  "3-5": {"Asia Minor": 0.55, "Levant": 0.25, "Egypt": 0.20}
  "6+": {"Asia Minor": 1.00, "Levant": 0.00, "Egypt": 0.00}

# parent_num_distribution (List[float], optional): Probabilities for a new
# manuscript having 1, 2, or 3 parents (exemplars). Must sum to 1.0.
parent_num_distribution: [0.8, 0.1, 0.1]

# geographical_candidate_pool_size (int, optional): Number of nearest neighbors
# considered as potential exemplars before reputation ranking.
geographical_candidate_pool_size: 10

# pa_intervention_radius (float, optional): Radius used to calculate local density
# when selecting the "innovator" node for PA intervention.
pa_intervention_radius: 10.0

# log_tick_frequency (int, optional): The frequency (in ticks) at which progress updates
# are logged to the console. Defaults to 100.
log_tick_frequency: 100

# validation_frequency (int, optional): The frequency (in ticks) at which a full genealogy
# graph validation (DAG and single root check) is performed.
# 0 means validation is disabled (except at initial root node creation).
# N > 0 means validation every N ticks. Defaults to 0.
validation_frequency: 0

